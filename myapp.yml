version: '3'
services:
 redis:
  image: redis:alpine
  networks:
   - frontend
  deploy:
   replicas: 1
 db:
  image: postgres:9.4
  networks:
   - backend
  volumes:
   - db_data:/var/lib/postgresql/data
  environment:
   POSTGRES_DB: "db"
   POSTGRES_HOST_AUTH_METHOD: "trust"
  deploy:
   replicas: 1
   placement:
    constraints: [node.role == manager]
 vote:
  image: dockersamples/examplevotingapp_vote:before
  ports:
   - 5000:80
  networks:
   - frontend
  depends_on:
   - redis
  deploy:
   replicas: 2
 result:
  image: dockersamples/examplevotingapp_result:before
  ports:
   - 5001:80
  networks:
   - backend
  depends_on:
   - db
  deploy:
   replicas: 1
 worker:
  image: dockersamples/examplevotingapp_worker
  networks:
   - frontend
   - backend
  depends_on:
   - db
   - redis
  deploy:
   replicas: 1
   placement:
    constraints: [node.role == manager]

networks:
 frontend:
 backend:
volumes:
 db_data:

